<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto</title>
</head>
<body>

  <header>
    <h1>Venta de Carros</h1>
    <nav>
      <p>
        <a href="index.html">Inicio</a> 
        <a href="vehiculos.html">Carros</a> 
        <a href="nosotros.html">Nosotros</a> 
        <a href="contacto.html">Contacto</a> |
        <a href="reporte.html">Reporte</a>
      </p>
    </nav>
  </header>

  <hr>

  <main>
    <h2>Contacto</h2>
    <p>Si quieres información de un carro, escríbenos.</p>

    <form action="gracias.html">
      <p>
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre">
      </p>
      <p>
        <label for="correo">Correo:</label><br>
        <input type="email" id="correo" name="correo">
      </p>
      <p>
        <label for="telefono">Teléfono:</label><br>
        <input type="tel" id="telefono" name="telefono">
      </p>
      <p>
        <label for="mensaje">Mensaje:</label><br>
        <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
      </p>
      <p>
        <button type="submit">Enviar</button>
      </p>
    </form>

    <h3>Dirección</h3>
    <address>
      Calle 10 # 5-25<br>
      Piedecuesta, Santander<br>
      Teléfono: 300 123 4567
    </address>
  </main>

  <hr>

  <footer>
    <p>Venta de Carros Piedecuesta, Santander</p>
    <p><small>Teléfono: 300 123 4567</small></p>
  </footer>

</body>
</html>
